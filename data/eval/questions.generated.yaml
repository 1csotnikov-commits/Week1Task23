questions:
- id: q01
  question: Что такое локальный модуль Честного знака (ЛМ ЧЗ) и куда он устанавливается?
  expected_answer: Программное обеспечение, устанавливаемое на локальный компьютер
    участника оборота (рабочую станцию кассира, кассовый сервер или отдельный ПК);
    также называется «локальный модуль ГИС МТ».
  expected_sources:
  - 01_lokalny_modul_chestny_znak.txt
  notes: Определение из раздела 1 «Краткое описание темы».
- id: q02
  question: Как расшифровывается аббревиатура ТС ПИоТ и куда устанавливается этот
    модуль?
  expected_answer: «Техническое средство получения информации о товаре» — программный
    модуль, устанавливаемый на компьютер с онлайн-кассой либо непосредственно в ККТ.
  expected_sources:
  - 02_ts_piot.txt
- id: q03
  question: Какие две стратегии чанкинга доступны в пайплайне индексации и какая из
    них используется по умолчанию?
  expected_answer: Стратегии fixed_size и structural; по умолчанию — structural.
  expected_sources:
  - config_example.json
  - readme_guide.md#Стратегии чанкинга
  notes: В config_example.json default = structural; в readme описаны обе стратегии
    и команда /index compare.
- id: q04
  question: Какая модель эмбеддингов и какая размерность вектора указаны в конфигурации
    пайплайна?
  expected_answer: Провайдер nomic, модель nomic-ai/nomic-embed-text-v2-moe, размерность
    768.
  expected_sources:
  - config_example.json
- id: q05
  question: Где хранятся векторный индекс и метаданные в пайплайне индексации?
  expected_answer: Векторный индекс — в FAISS, метаданные — в SQLite.
  expected_sources:
  - config_example.json
  - readme_guide.md#Обзор
- id: q06
  question: Из каких этапов состоит процесс индексации документов согласно intro.txt?
  expected_answer: Загрузка документов из каталога, разбиение текста на чанки, вычисление
    эмбеддинга для каждого чанка.
  expected_sources:
  - intro.txt
- id: q07
  question: Что такое эмбеддинг и как определяется смысловая близость фрагментов текста?
  expected_answer: Числовой вектор, отражающий смысл фрагмента текста; чем ближе два
    вектора, тем ближе фрагменты по смыслу.
  expected_sources:
  - intro.txt
- id: q08
  question: Какие источники были недоступны в ходе сбора информации по практическим
    инструкциям ЛМ ЧЗ и ТС ПИоТ и какие источники использовались вместо них?
  expected_answer: 'Недоступны честныйзнак.рф и docs.chestnyznak.ru (HTTP 403 / ошибка
    соединения); использовались вторичные источники: saby.ru, ao-esp.ru, tspiot.ru,
    markirovka.ru.'
  expected_sources:
  - 07_prakticheskie_instrukcii.txt
- id: q09
  question: Почему разделы «обобщение практики» в документе о настройке в 1С требуют
    сверки с актуальной методикой?
  expected_answer: Раздел ИТС (its.1c.ru) отвечал в кодировке Windows-1251 и не позволил
    корректно извлечь текст, а releases.1c.ru доступен только после авторизации; поэтому
    разделы сформулированы на основе типовой логики конфигураций 1С.
  expected_sources:
  - 03_nastroyka_v_1c.txt
- id: q10
  question: Какие файлы и их объёмы перечислены в отчёте о выполненной работе?
  expected_answer: 01_lokalny_modul_chestny_znak.txt — 14 816 знаков (24 452 байта),
    02_ts_piot.txt — 14 950 знаков (24 204 байта), 03_nastroyka_v_1c.txt и другие;
    все в формате .txt, кодировка UTF-8.
  expected_sources:
  - 00_otchet_o_rabote.txt
  notes: В отчёте перечислены созданные файлы с указанием объёма.
